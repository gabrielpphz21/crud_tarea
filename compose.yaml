services:
  go-api:
    image: cfa6894f7487
    depends_on:
      psqlDB:
        condition: service_healthy
    ports:
      - 8080:8080

  psqlDB:
    image: postgres:18.6-alpine3.24
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: "password"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10




